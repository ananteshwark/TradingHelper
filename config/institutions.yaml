# Prominent institutional investors, foreign (FII) and domestic (DII). Their trades in NSE's
# bulk and block deal files go to Telegram (igs.institutions, rules.institution_deals in
# alerts.yaml).
#
# Collected on 17 October 2026 from:
#   - AMFI's mutual fund houses and their AUM ranking;
#   - IRDAI's registered life, general and health insurers and reinsurers;
#   - PFRDA's NPS pension fund managers;
#   - Prime Database's largest foreign portfolio investors (GIC, Norges Bank, Capital
#     Group, Vanguard, Goldman Sachs, GQG and others);
#   - the client names under which these institutions appear in NSE's block deals,
#     2013–2026.
#
# A client name matches an entry when, in capitals with spaces and punctuation removed, it
# contains one of the entry's `match` fragments (written here in plain form). Entries are
# tried in order, so a specific one comes first: HSBC Mutual Fund (DII) before HSBC (FII).
# High-frequency and proprietary trading firms are not institutional investors and are
# left out. A name that is ambiguous (e.g. a bare "EMPLOYEES PROVIDENT FUND", which in
# deal files is usually Malaysia's) is left out rather than guessed.

institutions:
