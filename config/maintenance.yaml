# Cleanup of stale data and backups (igs.maintenance, docs/MAINTENANCE.md). A daily job
# (igs-maintenance.timer, 03:17 IST) runs it; `igs maintenance cleanup` and the Settings page
# run it now. Records are never removed: calls, trades, scores, paper tracks, what was
# loaded from the downloads, and every download the database is built from.

# false: the daily job and the deployment script remove nothing (Clean up now still works).
cleanup_enabled: true

# Job logs (logs/*.log, one per scheduled command): entries older than this many days.
log_days: 30

# Intraday scans: each scan's row for a stock it checked without making a call, older
# than this many days. Buy and sell calls stay; their record is built from them.
scan_days: 14

# The history of data checks (each 30-minute check's steps) and the data-quality issues
# they logged, older than this many days. Each score run keeps its own summary of them.
check_days: 180

# Backups the deployment script makes before each deploy (a database dump and the source,
# in /home/anant/deploy-backups): after a successful deploy it keeps the newest
# backups_keep, and any younger than backup_days, and removes the rest.
backups_keep: 5

# Deployment backups younger than this many days always stay, however many there are.
backup_days: 30

# NSE and Screener downloads that nothing reads again, older than this many days:
# verification samples (never loaded), failed responses (errors, missing files, retried
# attempts) and Screener exports a newer export of the same company replaced. Their
# fetch records stay. The NSE files the database is built from stay (`igs rebuild`
# replays them) unless the switch below is on.
download_days: 30

# Also delete NSE's files once loaded into the database: price files (bhavcopies,
# delivery, index closes, market caps) and filing documents, older than
# loaded_nse_file_days. Nothing reads them again except a rebuild (`igs rebuild`), and
# only files NSE keeps at a fixed address are deleted, so they can be downloaded again
# first: `igs rebuild --download`, or `igs raw restore` alone. A file NSE now serves
# differently, or no longer serves, can't come back, and a rebuild then doesn't start.
# Lists and API answers (the equity list, announcements...) are never deleted.
delete_loaded_nse_files: false

# With the switch on: NSE files loaded and older than this many days are deleted.
loaded_nse_file_days: 365

# Full backups made or uploaded on the Maintenance tab (data/backups, docs/BACKUP.md): the
# newest this many are kept. Download the ones to keep elsewhere.
app_backups_keep: 3

# Old copies of the schedule files (scripts/install-schedules.sh keeps one each time it
# replaces a changed unit): the newest this many of each are kept.
unit_backups_keep: 3
