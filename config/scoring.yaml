# Composite score configuration.
#
# Pillar weights are a prior, not a finding: this app has not yet backtested them on
# real data. They follow the published Indian evidence rather than a growth tilt:
#   - Momentum, quality, value and low volatility get equal weight, as in NSE's
#     multi-factor index (Nifty500 Multifactor MQVLv 50, whitepaper 2024).
#   - In long-only BSE 200 tests for 2007-2021 (Raju & Teli 2022), volatility-adjusted
#     momentum, low volatility and quality earned the highest alphas after costs, and a
#     multi-parameter growth screen trailed the index. Growth therefore keeps a
#     smaller weight here rather than the largest.
#   - Ownership rests mainly on promoter pledging, a crash-risk signal.
# The robustness gate below still redraws these weights around the prior. Replace them
# with backtested weights once the IC report has enough history, and remove factors
# that show no information coefficient from `enabled`: they are not kept because the
# story sounds good.

# Experimental overlay in composite z-score units, not predicted percent returns.
# Uses only stored, sourced AI assessments available at the run's as-of time.
# No assessment means no adjustment. Existing rejection/coverage checks still apply.
geopolitical:
  enabled: true
  max_adjustment: 0.15
  min_confidence: 0.6
  half_life_days: 7
  max_age_days: 21

# Market sentiment (igs.sentiment). Experimental, like the geopolitical overlay: capped,
# shown separately on every run and stock, and measured by the backtest like any other
# rule. Set `enabled: false` to switch either part off.
sentiment:
  # Whole-market mood, from prices the app already loads: -1 is fear, +1 greed. It moves
  # every stock alike, so it acts on the ranking only by tilting pillar weights: when the
  # mood is negative, momentum loses weight and quality and low volatility gain it; when
  # positive, the reverse. The tilt is continuous and at most max_tilt of a pillar's own
  # weight (25%: momentum 20% moves between 15% and 25%), then the weights are rescaled
  # to sum to 1.
  # Why these pillars: momentum profits have followed rising markets and collapsed in
  # rebounds after falls (Cooper, Gutierrez and Hameed 2004; Daniel and Moskowitz 2016),
  # and high-quality stocks held up in crises ("flight to quality", Asness, Frazzini and
  # Pedersen 2019). Neither is tested on Indian data by this app yet; the tilt is a
  # capped prior.
  market:
    enabled: true
    max_tilt: 0.25
    tilt: {momentum: 1, quality: -1, low_volatility: -1}
    min_readings: 3            # fewer readings available: no tilt, and the run says why
    # Each reading scores -1 at its first value (fear) and +1 at its second (greed),
    # linearly between and clipped outside; the mood is their average. The values are
    # round numbers chosen by hand, not fitted.
    readings:
      breadth_200dma: [0.30, 0.70]        # share of the universe above its 200-day average
      index_vs_200dma: [-0.08, 0.08]      # Nifty 500 against its 200-day average
      advance_decline_20d: [-0.10, 0.10]  # (advances - declines) / both, last 20 sessions
      highs_lows_52w: [-0.10, 0.10]       # share at a 52-week closing high in the last 20
                                          # sessions, minus the share at a low
      volatility_rank_1y: [0.90, 0.10]    # Nifty 500 20-day volatility's rank in its past
                                          # year (high volatility is fear)
  # Each stock's own sentiment: its brokers' calls and the tone of its news, averaged
  # with these weights over what is available, as an overlay on its composite of at most
  # max_adjustment (composite z-score units, as the geopolitical overlay). No calls and no
  # news mean no adjustment. A stock that reaches the High conviction band only through a
  # positive adjustment is held at Watchlist: the adjustment is not validated yet.
  # - brokers: each broker's latest research call in window_days counts once: +1 for a
  #   buy, 0 hold, -1 sell, or +1/-1 for an upgrade/downgrade from that broker's previous
  #   call. Rating changes, more than rating levels, have been followed by returns
  #   (Womack 1996; Jegadeesh, Kim, Krische and Lee 2004). Targets are shown, not scored:
  #   large implied upsides have mostly not been reached (Bradshaw, Brown and Huang 2013).
  # - news: the AI's reading of each stock-news article's tone for the company (-1 to +1,
  #   with confidence; features.news_tone in assistant.yaml). Price moves and brokers'
  #   calls are not counted as news.
  # Each item fades with its age (half_life_days), and the average is shrunk by n/(n+1),
  # so one call or article counts half as much as a strong consensus.
  stock:
    enabled: true
    max_adjustment: 0.10
    brokers: {weight: 0.6, window_days: 30, half_life_days: 14, revision_lookback_days: 365}
    news: {weight: 0.4, window_days: 14, half_life_days: 5, min_confidence: 0.6}

pillar_weights:
  momentum: 0.20
  quality: 0.20
  valuation: 0.20
  low_volatility: 0.20
  growth: 0.15
  ownership: 0.05

# Within each pillar, enabled factors are equal-weighted unless `weights` gives
# explicit values (which must then sum to 1 within the pillar). A factor with weight 0
# is still computed, shown on the stock page and measured by the backtest, but does
# not move the score: used for factors without Indian evidence of predictive power.
pillars:
  growth:
    enabled:
      - revenue_cagr_3y
      - revenue_cagr_5y
      - ebitda_cagr_3y
      - ebitda_cagr_5y
      - pat_cagr_3y
      - pat_cagr_5y
      - revenue_ttm_yoy
      - pat_ttm_yoy
      - growth_acceleration_4q
      - growth_consistency_12q
      - revenue_quarter_yoy
      - pat_quarter_yoy
      - revenue_2q_yoy
      - pat_2q_yoy
      - opm_quarter_yoy
      - eps_diluted_yoy
    # Preserve the existing composite while collecting short-history evidence for
    # independent growth profiles and future out-of-sample validation.
    weights:
      revenue_cagr_3y: 0.10
      revenue_cagr_5y: 0.10
      ebitda_cagr_3y: 0.10
      ebitda_cagr_5y: 0.10
      pat_cagr_3y: 0.10
      pat_cagr_5y: 0.10
      revenue_ttm_yoy: 0.10
      pat_ttm_yoy: 0.10
      growth_acceleration_4q: 0.10
      growth_consistency_12q: 0.10
      revenue_quarter_yoy: 0.0
      pat_quarter_yoy: 0.0
      revenue_2q_yoy: 0.0
      pat_2q_yoy: 0.0
      opm_quarter_yoy: 0.0
      eps_diluted_yoy: 0.0
  quality:
    enabled:
      - roce
      - roe
      - opm_level
      - opm_trend_8q
      - cash_conversion_3y
      - net_debt_to_ebitda
      - interest_coverage
      - working_capital_days_trend
      - eps_dilution_pct
      - cash_profit_1y
      - free_cash_flow_margin
      - capex_revenue
      - incremental_ebit_return
      - advances_yoy
      - gnpa_pct
      - nnpa_pct
      - capital_adequacy_pct
    weights:
      roce: 0.125
      roe: 0.125
      opm_level: 0.125
      opm_trend_8q: 0.125
      cash_conversion_3y: 0.125
      net_debt_to_ebitda: 0.125
      interest_coverage: 0.125
      working_capital_days_trend: 0.125
      eps_dilution_pct: 0.0
      cash_profit_1y: 0.0
      free_cash_flow_margin: 0.0
      capex_revenue: 0.0
      incremental_ebit_return: 0.0
      advances_yoy: 0.0
      gnpa_pct: 0.0
      nnpa_pct: 0.0
      capital_adequacy_pct: 0.0
  valuation:
    enabled:
      - pe_vs_own_5y_median
      - peg_trailing
      - ev_ebitda
      - pb
  momentum:
    enabled:
      - risk_adj_return_6m
      - risk_adj_return_12m
      - risk_adj_return_6m_skip1m
      - risk_adj_return_12m_skip1m
      - rs_6m_vs_nifty500
      - rs_12m_vs_nifty500
      - price_vs_200dma
      - dma_50_200_state
      - delivery_pct_20d_vs_1y
      - relative_volume_20d
      - volume_breakout_60d
      - up_down_volume_20d
    # NSE's momentum indices score 6- and 12-month returns divided by volatility.
    # Raw relative strength, the moving-average signals and delivery % are tracked at
    # zero weight: delivery % has no consistent Indian evidence. The skip-month versions
    # (returns ending a month ago, the academic form) are tracked at zero weight until
    # the backtest shows which form predicts better on Indian data.
    weights:
      risk_adj_return_6m: 0.5
      risk_adj_return_12m: 0.5
      risk_adj_return_6m_skip1m: 0.0
      risk_adj_return_12m_skip1m: 0.0
      rs_6m_vs_nifty500: 0.0
      rs_12m_vs_nifty500: 0.0
      price_vs_200dma: 0.0
      dma_50_200_state: 0.0
      delivery_pct_20d_vs_1y: 0.0
      relative_volume_20d: 0.0
      volume_breakout_60d: 0.0
      up_down_volume_20d: 0.0
  low_volatility:
    enabled:
      - volatility_1y
  ownership:
    enabled:
      - promoter_holding_qoq
      - pledge_pct
      - pledge_trend
      - fii_dii_holding_change
      - institutional_holder_count
      - insider_buying_90d
    # Pledging predicts crash risk in Indian data, and disclosed insider purchases were
    # followed by abnormal returns (about 6.7% over 90 days in a 2026 study of SEBI PIT
    # disclosures). No Indian study tests quarter-end changes in institutional holdings,
    # so those are tracked at zero weight.
    weights:
      promoter_holding_qoq: 0.15
      pledge_pct: 0.35
      pledge_trend: 0.15
      insider_buying_90d: 0.35
      fii_dii_holding_change: 0.0
      institutional_holder_count: 0.0

# Sector-specific valuation modules. A factor not listed for a module is not
# computed for that module's stocks at all (it is not imputed). EV/EBITDA is
# never applied to banks or NBFCs.
valuation_modules:
  default: [pe_vs_own_5y_median, peg_trailing, ev_ebitda, pb]
  bank: [pe_vs_own_5y_median, peg_trailing, pb]
  nbfc: [pe_vs_own_5y_median, peg_trailing, pb]
  insurance: [pe_vs_own_5y_median, pb]

# Cross-sectional normalisation.
winsorize:
  lower_pct: 0.01
  upper_pct: 0.99

# Z-scores are computed within industry peer groups, never against the whole
# market. If an industry has fewer than min_peers stocks with a valid value,
# the broader fallback level is used for that factor.
peer_group:
  level: industry
  fallback_level: sector
  min_peers: 8

# Output tiers (never buy/sell calls). A stock that trips any red flag, or whose
# composite cannot be computed, is Rejected with the reason. Among the rest:
#   High conviction: composite in the top high_conviction_top_pct of scored
#                    names, coverage >= high_conviction_min_coverage and every
#                    red flag evaluable (none "data unavailable")
#   Watchlist:       composite in the top watchlist_top_pct
#   Not shortlisted: everything else
tiers:
  high_conviction_top_pct: 10
  watchlist_top_pct: 30
  high_conviction_min_coverage: 0.8

# Refuse factors that the latest backtest IC report marked DROP.
respect_ic_status: true

# Robustness gates for High conviction. A top rank must survive reasonable
# disagreement about how the score is built; each failed gate is listed as a
# reason. See src/igs/score/robustness.py.
robustness:
  enabled: true
  # Pillar weights redrawn weight_draws times from a Dirichlet centred on the weights
  # above (higher concentration = draws closer to them; 30 lets a 0.20 weight move
  # roughly between 0.08 and 0.36). Fixed seed: every run is reproducible.
  weight_draws: 200
  weight_concentration: 30
  seed: 20240401
  # Share of draws in which the stock stays in the High conviction band.
  min_weight_stability: 0.6
  # In the top persistence_top_pct at min_persistence of the previous
  # persistence_months month-ends (ranks computed as of those dates).
  persistence_months: 2
  persistence_top_pct: 30
  min_persistence: 2
  # Breadth: pillars scoring above zero, and a floor on the weakest pillar (z units).
  min_positive_pillars: 3
  min_pillar_score: -1.0
  # Largest share of the positive contribution allowed from a single factor.
  max_factor_share: 0.4

# Plausibility bounds on raw factor values. A value outside its range is far more
# likely a data error (a units mix-up, a mis-tagged line) than a fact; it is marked
# "implausible", left out of the score (never clipped or replaced), logged as a
# data-quality issue, and keeps the stock out of High conviction until checked.
# Fractions for growth and returns (3.0 = +300%); percentage points for ownership.
plausibility:
  revenue_quarter_yoy: [-0.95, 10.0]
  pat_quarter_yoy: [-0.99, 20.0]
  revenue_2q_yoy: [-0.95, 10.0]
  pat_2q_yoy: [-0.99, 20.0]
  opm_quarter_yoy: [-1.0, 1.0]
  revenue_cagr_3y: [-0.9, 3.0]
  revenue_cagr_5y: [-0.9, 3.0]
  ebitda_cagr_3y: [-0.95, 5.0]
  ebitda_cagr_5y: [-0.95, 5.0]
  pat_cagr_3y: [-0.95, 5.0]
  pat_cagr_5y: [-0.95, 5.0]
  revenue_ttm_yoy: [-0.95, 10.0]
  pat_ttm_yoy: [-0.99, 20.0]
  growth_acceleration_4q: [-5.0, 5.0]
  growth_consistency_12q: [0, 12]
  roce: [-2.0, 3.0]
  roe: [-3.0, 3.0]
  opm_level: [-3.0, 1.0]
  opm_trend_8q: [-0.5, 0.5]
  cash_conversion_3y: [-10.0, 10.0]
  net_debt_to_ebitda: [-100.0, 100.0]
  interest_coverage: [-1000.0, 100.0]
  working_capital_days_trend: [-1000.0, 1000.0]
  pe_vs_own_5y_median: [0.0, 50.0]
  peg_trailing: [0.0, 100.0]
  ev_ebitda: [-500.0, 1000.0]
  pb: [0.0, 500.0]
  risk_adj_return_6m: [-20.0, 50.0]
  risk_adj_return_12m: [-20.0, 50.0]
  risk_adj_return_6m_skip1m: [-20.0, 50.0]
  risk_adj_return_12m_skip1m: [-20.0, 50.0]
  rs_6m_vs_nifty500: [-1.0, 20.0]
  rs_12m_vs_nifty500: [-1.0, 30.0]
  price_vs_200dma: [-0.95, 10.0]
  dma_50_200_state: [0, 1]
  delivery_pct_20d_vs_1y: [0.0, 20.0]
  volatility_1y: [0.0, 5.0]
  promoter_holding_qoq: [-100.0, 100.0]
  pledge_pct: [0.0, 100.0]
  pledge_trend: [-100.0, 100.0]
  fii_dii_holding_change: [-100.0, 100.0]
  institutional_holder_count: [-10000, 10000]
  insider_buying_90d: [0.0, 25.0]

# Run health. A run whose inputs are stale, or which differs from the previous run
# far more than a month of new filings and prices explains, publishes no High
# conviction names (they show as Watchlist with the reason) and raises an alert.
# The run is still stored, so the problem can be inspected.
run_health:
  enabled: true
  max_price_age_days: 5            # latest price vs the as-of date (calendar days)
  min_universe_traded_share: 0.9   # share of the universe with a price on that date
  max_announcement_age_days: 4
  max_surveillance_age_days: 10
  max_results_age_days: 45         # newest financial results filing known
  # Drift against the previous run, when it is at most drift_max_gap_days older.
  drift_max_gap_days: 45
  max_universe_change: 0.15        # relative change in universe size
  max_coverage_drop: 0.10          # fall in median composite coverage
  max_factor_ok_drop: 0.25         # fall in any factor's share of computable values
  min_top_decile_overlap: 0.3      # share of the previous top decile still in it
