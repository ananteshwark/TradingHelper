# Red flags and cautions.
#
# severity: reject   a tripped check moves the stock to "Rejected" with the reason and
#                    the source rows (a hard filter, never merely a penalty).
# severity: caution  a tripped check keeps the stock out of "High conviction"; it can
#                    still be on the Watchlist, with the reason shown.
#
# If the data needed to evaluate a check is unavailable, the check reports "data
# unavailable". It is never treated as a pass. For reject-severity checks that
# always keeps the stock out of High conviction; for cautions it does too unless
# `unavailable_blocks: false` (used where the inputs are often not filed at all,
# so requiring them would empty the tier without saying anything about the stock).
#
# Every threshold here is a starting point. The backtest's check-effectiveness
# table shows, for top-ranked names, how often stocks that tripped each check went
# on to fail compared with those that did not. Keep a check because that evidence
# supports it, not because the story sounds right.

# ------------------------------------------------------------------ governance and ownership

auditor_qualification:
  enabled: true
  severity: reject

resignations:
  enabled: true
  severity: reject
  # Roles whose resignation announcement trips the flag.
  roles: [statutory_auditor, cfo, independent_director]
  lookback_days: 365

pledge:
  enabled: true
  severity: reject
  # Pledged shares as a share of promoter holding.
  max_pledged_pct_of_promoter: 20.0

promoter_holding_decline:
  enabled: true
  severity: reject
  # Absolute fall in promoter holding (percentage points of total equity)
  # across the last two quarterly shareholding filings.
  max_decline_pp_two_quarters: 5.0

equity_dilution:
  enabled: true
  severity: reject
  # Primary issues only (bonus and split excluded).
  lookback_years: 3
  min_events: 2
  min_cumulative_share_increase_pct: 10.0

surveillance:
  enabled: true
  severity: reject
  # Any ASM/GSM stage on the screening date.
  asm: true
  gsm: true

contingent_liabilities:
  enabled: true
  severity: reject
  max_multiple_of_net_worth: 1.0

# ------------------------------------------------------------------ earnings quality

receivable_days_spike:
  enabled: true
  severity: reject
  multiple_of_3y_median: 1.5

other_income_share:
  enabled: true
  severity: reject
  max_pct_of_pbt: 25.0

# Cumulative operating cash flow <= 0 over the last `years` fiscal years while
# cumulative reported profit is positive.
cash_not_converting:
  enabled: true
  severity: reject
  years: 3

# (profit - operating cash flow) / average total assets, latest fiscal year.
accruals:
  enabled: true
  severity: caution
  max_pct_of_assets: 10.0

# Altman Z'' (emerging-market form). Below 1.1 is Altman's distress zone.
altman_distress:
  enabled: true
  severity: caution
  min_z: 1.1

# Piotroski F-score. Needs two consecutive fiscal years of statements.
piotroski_weak:
  enabled: true
  severity: caution
  unavailable_blocks: false
  max_score: 3
  min_components: 7

# Beneish eight-variable M-score; -1.78 is the cut-off in Beneish (1999).
beneish_manipulation:
  enabled: true
  severity: caution
  unavailable_blocks: false
  threshold: -1.78

# Cash & investments and borrowings both large relative to assets, while other
# income earns less than max_cash_yield_pct on the cash.
cash_debt_paradox:
  enabled: true
  severity: caution
  min_cash_pct_assets: 15.0
  min_debt_pct_assets: 15.0
  max_cash_yield_pct: 4.0

# Exceptional items over the last four quarters as a share of PBT.
exceptional_items:
  enabled: true
  severity: caution
  unavailable_blocks: false
  max_pct_of_pbt: 20.0

# A previously filed revenue/profit figure changed in a recent filing.
restatement:
  enabled: true
  severity: caution
  concepts: [revenue, interest_earned, pat, pat_owners, pbt]
  min_change_pct: 2.0
  lookback_days: 365

# ------------------------------------------------------------------ data integrity

# Consecutive quarterly revenue, consecutive total assets, or two versions of the
# same figure differ by about a power of ten (a units mix-up in a filing). The
# stock's numbers cannot be trusted until the filing is checked.
unit_scale_jump:
  enabled: true
  severity: reject
  lookback_quarters: 12
  tolerance: 0.2

# Revenue + other income = total income, assets = equity + liabilities, ... inside
# each filing of the last year.
statement_identity:
  enabled: true
  severity: caution
  unavailable_blocks: false
  rel_tol_pct: 1.0
  lookback_days: 400

# The next quarter's results not filed by the SEBI LODR deadline plus grace.
results_overdue:
  enabled: true
  severity: reject
  deadline_days: 45
  q4_deadline_days: 60
  grace_days: 7
  # Deadlines SEBI extended. The two below are the COVID-19 relaxations as recalled
  # when this file was written (Mar-2020 quarter to 31 Jul 2020, Jun-2020 quarter to
  # 15 Sep 2020); confirm them against the SEBI circulars before relying on 2020
  # backtests. A later deadline here only delays the check, never trips it early.
  extensions:
    - {quarter_end: 2020-03-31, deadline: 2020-07-31}
    - {quarter_end: 2020-06-30, deadline: 2020-09-15}

# ------------------------------------------------------------------ market behaviour

illiquid:
  enabled: true
  severity: caution
  lookback_sessions: 60
  min_median_traded_value_cr: 1.0
  min_traded_session_pct: 90.0

high_volatility:
  enabled: true
  severity: caution
  lookback_sessions: 250
  min_observations: 120
  max_annualised_pct: 60.0

speculative_runup:
  enabled: true
  severity: caution
  lookback_sessions: 250
  min_observations: 200
  max_return_pct: 300.0

deep_drawdown:
  enabled: true
  severity: caution
  lookback_sessions: 250
  min_observations: 200
  max_drawdown_pct: 50.0

trade_for_trade:
  enabled: true
  severity: caution
  unavailable_blocks: false
  series: [BE, BZ]
