# How long a sign-in lasts, for password sign-in (IGS_AUTH_MODE=password, the default)
# and Auth0 alike: session_hours after signing in, idle_minutes without activity.
# Password accounts are not here: `igs users` or Settings > Access (data/settings/accounts.sqlite3).
# The rest is for IGS_AUTH_MODE=oidc only, which stays closed until an OIDC provider and
# approved identities are configured.
# Put installation-specific values in data/settings/access.yaml (not in Git).
issuer: ''
admin_emails: []
viewer_emails: []
# Provider-scoped stable subject IDs also work for providers without verified email claims.
admin_subjects: []
viewer_subjects: []
session_hours: 8
idle_minutes: 30
