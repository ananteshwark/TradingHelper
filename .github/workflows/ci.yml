name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: igs
          POSTGRES_PASSWORD: igs
          POSTGRES_DB: igs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IGS_TEST_DATABASE_URL: postgresql://igs:igs@localhost:5432/igs_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - name: Look-ahead gate
        run: uv run pytest -m lookahead
      - run: uv run pytest
